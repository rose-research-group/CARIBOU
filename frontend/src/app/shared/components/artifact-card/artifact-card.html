<div class="artifact-card">
  @if (isPlot) {
    <img
      class="artifact-preview"
      [src]="previewUrl"
      [alt]="artifact.filename"
      loading="lazy"
      (click)="openLightbox()"
      title="Click to enlarge" />
  }
  <div class="artifact-info">
    <span class="artifact-name" [title]="artifact.filename">{{ artifact.filename }}</span>
    <span class="artifact-size">{{ formatSize(artifact.size_bytes) }}</span>
    <a class="btn btn-ghost btn-xs" [href]="downloadUrl" [download]="artifact.filename"
       aria-label="Download artifact" title="Download">
      <app-icon name="download" />
    </a>
  </div>
</div>

<!-- Lightbox overlay -->
@if (lightboxOpen) {
  <div class="lightbox-overlay" (click)="closeLightbox()">
    <div class="lightbox-container" (click)="$event.stopPropagation()">
      <button class="lightbox-close" (click)="closeLightbox()" aria-label="Close preview" title="Close">
        <app-icon name="x" [size]="18" />
      </button>
      <img class="lightbox-img" [src]="previewUrl" [alt]="artifact.filename" />
      <div class="lightbox-caption">
        {{ artifact.filename }}
        <a class="lightbox-download" [href]="downloadUrl" [download]="artifact.filename">
          <app-icon name="download" [size]="14" />
          <span>Download</span>
        </a>
      </div>
    </div>
  </div>
}
