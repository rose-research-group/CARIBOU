@let art = artifact();
<div class="lightbox-overlay" (click)="closed.emit()">
  <div class="lightbox-container" role="dialog" aria-modal="true" [attr.aria-label]="art.filename"
    (click)="$event.stopPropagation()">
    <button #closeButton type="button" class="lightbox-close" (click)="closed.emit()" aria-label="Close preview" title="Close">
      <app-icon name="x" [size]="18" />
    </button>
    <img class="lightbox-img" [src]="previewUrl()" [alt]="art.filename" />
    @if (hasPrev()) {
      <button type="button" class="lightbox-nav prev" (click)="prev.emit()" aria-label="Previous plot" title="Previous plot">
        <app-icon name="chevron-left" [size]="22" />
      </button>
    }
    @if (hasNext()) {
      <button type="button" class="lightbox-nav next" (click)="next.emit()" aria-label="Next plot" title="Next plot">
        <app-icon name="chevron-right" [size]="22" />
      </button>
    }
    <div class="lightbox-caption">
      @if (position(); as pos) { <span class="lightbox-pos">{{ pos }}</span> }
      {{ art.filename }}
      <a class="lightbox-download" [href]="downloadUrl()" [download]="art.filename">
        <app-icon name="download" [size]="14" />
        <span>Download</span>
      </a>
    </div>
  </div>
</div>
